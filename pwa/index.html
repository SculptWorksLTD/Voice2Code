<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voice2Code">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link id="mf" rel="manifest" href="/manifest.json">
<title>Voice2Code</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:#eee;font:16px -apple-system,system-ui,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
h1{margin:0;font-size:1.1rem;color:#888;font-weight:600;letter-spacing:1px}
#rec{width:min(62vw,260px);aspect-ratio:1;border-radius:50%;border:8px solid #333;background:#dc2626;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}
#rec:active{transform:scale(.96)}
#rec span{width:34%;aspect-ratio:1;border-radius:50%;background:#fff;transition:border-radius .2s}
#rec.on{background:#7f1d1d;animation:p 1.4s infinite}
#rec.on span{border-radius:12%}
#rec:disabled{opacity:.4}
@keyframes p{0%{box-shadow:0 0 0 0 #dc262688}100%{box-shadow:0 0 0 34px #dc262600}}
#timer{font:600 2.2rem ui-monospace,monospace;letter-spacing:2px}
#msg{min-height:3em;text-align:center;color:#aaa;max-width:320px;line-height:1.4}
#msg.ok{color:#4ade80}#msg.err{color:#f87171}
#q{color:#facc15;font-size:.9rem}
button.s{background:#333;color:#eee;border:0;border-radius:10px;padding:12px 22px;font-size:1rem}
</style>
</head>
<body>
<main>
  <h1>VOICE2CODE</h1>
  <button id="rec" aria-label="Registra"><span></span></button>
  <div id="timer">00:00</div>
  <div id="msg"></div>
  <div id="q"></div>
  <button id="retry" class="s" hidden>Invia adesso</button>
</main>
<script>
const $ = id => document.getElementById(id);
const qk = new URLSearchParams(location.search).get('k');
if (qk) localStorage.setItem('v2c_key', qk);
const KEY = qk || localStorage.getItem('v2c_key') || '';
if (KEY) $('mf').href = '/manifest.json?k=' + encodeURIComponent(KEY);

const MIME = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus']
  .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
let rec = null, stream = null, chunks = [], t0 = 0, tick = 0;

const say = (t, c = '') => { $('msg').textContent = t; $('msg').className = c; };
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

if (!KEY) { $('rec').disabled = true; say('Apri Voice2Code sul computer e inquadra il QR code con la fotocamera.', 'err'); }
else say('Tocca e parla. La prima volta di\' il tuo nome.');

// ---- coda locale (IndexedDB): niente audio perso se manca la rete ----
const db = new Promise((res, rej) => {
  const r = indexedDB.open('v2c', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('q', { autoIncrement: true });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const tx = async (mode, fn) => { const d = await db; return new Promise((res, rej) => { const t = d.transaction('q', mode); const s = t.objectStore('q'); const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
const qAdd = b => tx('readwrite', s => s.add(b));
const qAll = async () => { const d = await db; return new Promise(res => { const out = []; const c = d.transaction('q').objectStore('q').openCursor(); c.onsuccess = () => { const x = c.result; if (x) { out.push([x.key, x.value]); x.continue(); } else res(out); }; }); };
const qDel = k => tx('readwrite', s => s.delete(k));

let flushing = false;
async function flush() {
  if (flushing || !KEY) return; flushing = true;
  try {
    const items = await qAll();
    for (const [k, blob] of items) {
      say('Invio…');
      const r = await fetch('/upload', { method: 'POST', headers: { 'X-API-Key': KEY, 'Content-Type': blob.type || 'audio/wav' }, body: blob });
      if (r.status === 401) { say('Chiave non valida: inquadra di nuovo il QR code dal computer.', 'err'); break; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      await qDel(k);
      say('✓ Inviato', 'ok'); if (navigator.vibrate) navigator.vibrate(60);
    }
  } catch (e) { say('Senza rete: lo invio appena torna la connessione.', 'err'); }
  flushing = false; showQ();
}
async function showQ() { const n = (await qAll()).length; $('q').textContent = n ? n + ' in attesa di invio' : ''; $('retry').hidden = !n; }

$('rec').onclick = () => (rec && rec.state === 'recording') ? stop() : start();
$('retry').onclick = flush;
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && flush());

async function start() {
  if (!window.MediaRecorder) return say('Questo browser non può registrare.', 'err');
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } }); }
  catch (e) { return say('Microfono non permesso. Abilitalo nelle impostazioni del telefono.', 'err'); }
  chunks = [];
  rec = new MediaRecorder(stream, MIME ? { mimeType: MIME } : undefined);
  rec.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
  rec.onstop = finish;
  rec.start(1000);
  t0 = Date.now(); $('timer').textContent = '00:00';
  tick = setInterval(() => $('timer').textContent = fmt(Math.floor((Date.now() - t0) / 1000)), 250);
  $('rec').classList.add('on');
  say('Registro… tocca di nuovo per finire.');
}

function stop() { clearInterval(tick); $('rec').classList.remove('on'); rec.stop(); }

async function finish() {
  stream.getTracks().forEach(t => t.stop());
  const blob = new Blob(chunks, { type: (rec.mimeType || MIME || 'audio/mp4').split(';')[0] });
  if (!blob.size) return say('Registrazione vuota.', 'err');
  $('rec').disabled = true; say('Preparo l\'audio…');
  let out = blob; try { out = await toWav(blob); } catch (e) {}
  await qAdd(out);
  $('rec').disabled = false;
  flush();
}

async function toWav(blob) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  try {
    const ab = await blob.arrayBuffer();
    const buf = await new Promise((res, rej) => ac.decodeAudioData(ab, res, rej));
    const n = buf.length, ch = buf.numberOfChannels, mono = new Float32Array(n);
    for (let c = 0; c < ch; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / ch; }
    const ratio = buf.sampleRate / 16000, len = Math.floor(n / ratio), out = new Int16Array(len);
    for (let i = 0; i < len; i++) {
      const p = i * ratio, j = Math.floor(p), f = p - j, a = mono[j], b = j + 1 < n ? mono[j + 1] : a;
      const s = Math.max(-1, Math.min(1, a + (b - a) * f));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    const v = new DataView(new ArrayBuffer(44 + out.length * 2));
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); v.setUint32(4, 36 + out.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, out.length * 2, true);
    new Int16Array(v.buffer, 44).set(out);
    return new Blob([v.buffer], { type: 'audio/wav' });
  } finally { ac.close && ac.close(); }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
showQ(); flush();
</script>
</body>
</html>
