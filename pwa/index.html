<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-title" content="Voice2Code">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Voice2Code</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:#eee;font:16px -apple-system,system-ui,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
h1{margin:0;font-size:1.1rem;color:#888;font-weight:600;letter-spacing:1px}
#rec{width:min(62vw,260px);aspect-ratio:1;border-radius:50%;border:8px solid #333;background:#dc2626;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s;cursor:pointer}
#rec:active{transform:scale(.96)}
#rec span{width:34%;aspect-ratio:1;border-radius:50%;background:#fff;transition:border-radius .2s}
#rec.on{background:#7f1d1d;animation:p 1.4s infinite}
#rec.on span{border-radius:12%}
#rec:disabled{opacity:.4}
@keyframes p{0%{box-shadow:0 0 0 0 #dc262688}100%{box-shadow:0 0 0 34px #dc262600}}
#timer{font:600 2.2rem ui-monospace,monospace;letter-spacing:2px}
#max{color:#666;font-size:.85rem;margin-top:-14px}
#msg{min-height:3em;text-align:center;color:#aaa;max-width:340px;line-height:1.4}
#msg.ok{color:#4ade80}#msg.err{color:#f87171}
#q{color:#facc15;font-size:.9rem}
#notes{width:100%;max-width:420px}
#notes h2{font-size:.85rem;color:#777;font-weight:600;letter-spacing:1px;margin:10px 0 6px}
.n{background:#1b1b1b;border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;gap:8px;align-items:center}
.n div{flex:1;min-width:0}.n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.n small{color:#888}.n button{background:#333;color:#eee;border:0;border-radius:8px;padding:8px 10px;font-size:.85rem}
button.s{background:#333;color:#eee;border:0;border-radius:10px;padding:12px 22px;font-size:1rem;cursor:pointer}
#view{position:fixed;inset:0;background:#111;display:none;flex-direction:column;z-index:9;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
#view.on{display:flex}
#view pre{flex:1;overflow:auto;white-space:pre-wrap;word-wrap:break-word;font:14px/1.45 -apple-system,system-ui,sans-serif;color:#eee;margin:0 0 12px;-webkit-user-select:text;user-select:text}
#view .bar{display:flex;gap:8px}#view .bar button{flex:1;background:#333;color:#eee;border:0;border-radius:10px;padding:12px;font-size:1rem}
</style>
</head>
<body>
<main>
  <h1>VOICE2CODE</h1>
  <button id="rec" aria-label="Registra"><span></span></button>
  <canvas id="wave" width="260" height="44" style="width:260px;height:44px;visibility:hidden"></canvas>
  <div id="timer">00:00</div>
  <div id="max">massimo 60:00</div>
  <div id="msg"></div>
  <div id="q"></div>
  <button id="retry" class="s" hidden>Invia adesso</button>
  <div id="oldicon" hidden style="max-width:360px;text-align:center;color:#facc15;font-size:.9rem;line-height:1.4">Per registrare anche in background: elimina questa icona dalla Home, apri <b>voice2code.nerosdmf.workers.dev</b> in Safari e fai Condividi › Aggiungi a Home.</div>
  <section id="notes"></section>
  <div id="view"><pre id="vtext"></pre><div class="bar"><button id="vcopy">Copia</button><button id="vsave">Scarica</button><button id="vclose">Chiudi</button></div></div>
  <small style="color:#555">web app v1.0.15</small>
</main>
<script>
const RATE = 16000, PART_SEC = 240, MAX_SEC = 3600;
const $ = id => document.getElementById(id);
const KEY = 'v2c';
// niente modalità "app a sé": l'icona sulla Home apre Safari, che continua a registrare in background e a schermo bloccato
const STANDALONE = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

const say = (t, c = '') => { $('msg').textContent = t; $('msg').className = c; };
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

say('Tocca e parla. La prima volta di\' il tuo nome.');

// ---------- coda locale (IndexedDB) con ripiego in memoria: niente audio perso se manca la rete ----------
window.addEventListener('error', e => { if (!e.filename || !e.filename.startsWith(location.origin) || /^Script error/i.test(e.message || '')) return; say('Errore: ' + e.message, 'err'); });
window.addEventListener('unhandledrejection', e => say('Errore: ' + ((e.reason && e.reason.message) || e.reason), 'err'));
const mem = []; let memKey = 0;
const db = new Promise(res => {
  try {
    const r = indexedDB.open('v2c', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('q', { autoIncrement: true });
    r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
    setTimeout(() => res(null), 3000);
  } catch (e) { res(null); }
});
const tx = async (mode, fn) => {
  const d = await db; if (!d) throw new Error('no db');
  return new Promise((res, rej) => {
    const t = d.transaction('q', mode); fn(t.objectStore('q'));
    t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    setTimeout(() => rej(new Error('db timeout')), 5000);
  });
};
async function qAdd(v) { try { await tx('readwrite', s => s.add(v)); } catch (e) { mem.push(['m' + (memKey++), v]); } }
async function qDel(k) { const i = mem.findIndex(x => x[0] === k); if (i >= 0) { mem.splice(i, 1); return; } try { await tx('readwrite', s => s.delete(k)); } catch (e) {} }
async function qAll() {
  let out = [];
  try {
    const d = await db;
    if (d) out = await new Promise(res => { const o = []; const c = d.transaction('q').objectStore('q').openCursor(); c.onsuccess = () => { const x = c.result; if (x) { o.push([x.key, x.value]); x.continue(); } else res(o); }; c.onerror = () => res(o); setTimeout(() => res(o), 5000); });
  } catch (e) {}
  return out.concat(mem);
}
const toBody = v => v instanceof Blob ? v : v.data ? new Blob([v.data], { type: v.type || 'audio/wav' }) : v.blob;

let flushing = false;
async function flush() {
  if (flushing || !KEY) return; flushing = true;
  try {
    for (const [k, v] of await qAll()) {
      const body = toBody(v);
      const qs = v instanceof Blob ? '' : `?id=${encodeURIComponent(v.id)}&part=${v.part}&last=${v.last ? 1 : 0}`;
      const ctype = (v && v.type) || body.type || 'audio/wav';
      if (!isRec()) say('Invio… (' + Math.ceil(body.size / 1024) + ' KB)');
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 60000 + body.size / 20);
      let r;
      try { r = await fetch('/upload' + qs, { method: 'POST', headers: { 'Content-Type': ctype }, body, signal: ctl.signal }); }
      finally { clearTimeout(to); }
      if (!r.ok) throw new Error('il server ha risposto ' + r.status);
      await qDel(k);
      if (!isRec() && (v instanceof Blob || v.last)) { say('✓ Inviato', 'ok'); if (navigator.vibrate) navigator.vibrate(60); }
    }
  } catch (e) { if (!isRec()) say('Non inviato (' + (e.name === 'AbortError' ? 'tempo scaduto' : e.message) + '). Riprovo appena possibile.', 'err'); }
  flushing = false; showQ();
}
async function showQ() { const n = (await qAll()).length; $('q').textContent = n ? n + ' pezzi in attesa di invio' : ''; $('retry').hidden = !n || isRec(); }
setInterval(() => { if (!isRec()) flush(); }, 30000);

// ---------- registrazione: registratore di Safari/Chrome, a pezzi da 4 minuti, convertiti in WAV 16 kHz ----------
const MIME = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus']
  .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
let stream = null, wake = null, mr = null, recording = false, t0 = 0, tick = 0, recId = '', partNo = 0, partStart = 0, conv = Promise.resolve();
const isRec = () => recording;

function wav(int16) {
  const v = new DataView(new ArrayBuffer(44));
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + int16.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, RATE, true); v.setUint32(28, RATE * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, int16.length * 2, true);
  return new Blob([v.buffer, int16], { type: 'audio/wav' });
}

async function toWav16(blob) {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ctx = new OAC(1, 1, 44100);
  const ab = await blob.arrayBuffer();
  const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
  const n = buf.length, ch = buf.numberOfChannels, ratio = buf.sampleRate / RATE, len = Math.floor(n / ratio);
  const chans = []; for (let c = 0; c < ch; c++) chans.push(buf.getChannelData(c));
  const at = i => { let s = 0; for (let c = 0; c < ch; c++) s += chans[c][i]; return s / ch; };
  const out = new Int16Array(len);
  for (let i = 0; i < len; i++) {
    const p = i * ratio, j = Math.floor(p), f = p - j, a = at(j), b = j + 1 < n ? at(j + 1) : a;
    const s = Math.max(-1, Math.min(1, a + (b - a) * f));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return wav(out);
}

function handlePart(blob, last) {
  partNo++;
  const part = partNo, id = recId;
  if (last) remember(id);
  conv = conv.then(async () => {
    let out = blob;
    try { out = await toWav16(blob); } catch (e) {}
    await qAdd({ data: await out.arrayBuffer(), type: out.type || 'audio/mp4', id, part, last });
    flush();
  }).catch(e => say('Errore pezzo ' + part + ': ' + e.message, 'err'));
}

function newRecorder() {
  const chunks = [];
  const r = new MediaRecorder(stream, MIME ? { mimeType: MIME } : undefined);
  r.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  r.onstop = () => {
    const blob = new Blob(chunks, { type: (r.mimeType || MIME || 'audio/mp4').split(';')[0] });
    const last = !recording;
    if (blob.size) handlePart(blob, last);
    if (recording) newRecorder();
    else say('Invio…');
  };
  r.start(1000);
  mr = r; partStart = Date.now();
}

$('rec').onclick = () => (recording ? stop() : start().catch(e => say('Non riesco ad avviare la registrazione: ' + e.message, 'err')));
$('retry').onclick = flush;
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') return flush();
  // web app in secondo piano e nessuna registrazione: libero il microfono
  if (!recording && stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
});

// ---------- onda: si muove con la voce mentre registri ----------
let wctx = null, wan = null, wsrc = null, wraf = 0;
const whist = new Array(32).fill(0);
function waveStart() {
  // AudioContext creato nel tocco (Safari lo esige); se resta sospeso, l'onda pulsa a tempo
  try { const AC = window.AudioContext || window.webkitAudioContext; if (!wctx || wctx.state === 'closed') wctx = new AC(); wctx.resume(); } catch (e) { wctx = null; }
}
function waveAttach() {
  try { wsrc = wctx.createMediaStreamSource(stream); wan = wctx.createAnalyser(); wan.fftSize = 512; wsrc.connect(wan); } catch (e) { wan = null; }
  $('wave').style.visibility = 'visible';
  const data = new Uint8Array(512), c = $('wave'), g = c.getContext('2d');
  const loop = () => {
    let v;
    if (wan && wctx.state === 'running') { wan.getByteTimeDomainData(data); let pk = 0; for (const x of data) pk = Math.max(pk, Math.abs(x - 128)); v = Math.sqrt(pk / 128) * 1.3; }
    else v = 0.25 + 0.2 * Math.abs(Math.sin(Date.now() / 300));
    whist.shift(); whist.push(v);
    const w = c.width, h = c.height, bw = w / whist.length;
    g.clearRect(0, 0, w, h); g.fillStyle = '#f87171';
    whist.forEach((x, i) => { const bh = Math.max(3, Math.min(1, x) * h); g.fillRect(i * bw + 1.5, (h - bh) / 2, bw - 3, bh); });
    wraf = setTimeout(loop, 70);
  };
  clearTimeout(wraf); loop();
}
function waveStop() {
  clearTimeout(wraf); whist.fill(0); $('wave').style.visibility = 'hidden';
  try { wsrc && wsrc.disconnect(); } catch (e) {}
  wsrc = null; wan = null;
}

async function start() {
  waveStart();
  if (!window.MediaRecorder) return say('Questo browser non può registrare: aggiorna iOS o usa Chrome.', 'err');
  say('Accendo il microfono…');
  // il microfono resta aperto finché la web app è in primo piano: iPhone chiede il permesso una volta sola
  const live = stream && stream.getAudioTracks().some(t => t.readyState === 'live');
  if (!live) {
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (e) { return say('Microfono non permesso (' + e.message + '). Impostazioni › App › Safari › Microfono › Consenti.', 'err'); }
  }
  recId = new Date().toISOString().replace(/[:.]/g, '-') + '_' + Math.random().toString(36).slice(2, 10);
  partNo = 0; recording = true;
  newRecorder();
  waveAttach();
  t0 = Date.now(); $('timer').textContent = '00:00';
  tick = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $('timer').textContent = fmt(s);
    if (s >= MAX_SEC) { stop(); say('Raggiunto il limite di 60 minuti: registrazione inviata.', 'ok'); return; }
    if (Date.now() - partStart >= PART_SEC * 1000 && mr && mr.state === 'recording') mr.stop();
  }, 250);
  try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  $('rec').classList.add('on'); $('retry').hidden = true;
  say(STANDALONE
    ? 'Registro… ATTENZIONE: aperta dall\'icona vecchia, se cambi app si ferma. Rifai l\'icona da Safari (vedi sotto).'
    : 'Registro… puoi cambiare app o bloccare lo schermo. Tocca di nuovo per finire.', STANDALONE ? 'err' : '');
}

function stop() {
  if (!recording) return;
  recording = false; clearInterval(tick); waveStop();
  $('rec').classList.remove('on');
  try { wake && wake.release(); } catch (e) {}
  if (Date.now() - t0 < 1000) say('Registrazione troppo corta.', 'err');
  if (mr && mr.state !== 'inactive') mr.stop();
}

// ---------- le mie note: prompt pronti da scaricare ----------
function myNotes() { try { return JSON.parse(localStorage.getItem('v2c_notes') || '[]'); } catch (e) { return []; } }
function remember(id) { const l = myNotes().filter(x => x.id !== id); l.unshift({ id, t: Date.now() }); localStorage.setItem('v2c_notes', JSON.stringify(l.slice(0, 30))); }
const cache = {};
async function loadNotes() {
  const box = $('notes'), list = myNotes();
  if (!list.length) { box.innerHTML = ''; return; }
  for (const n of list) if (!cache[n.id]) {
    try { const r = await fetch('/result/' + encodeURIComponent(n.id), { cache: 'no-store' }); if (r.ok) cache[n.id] = await r.json(); } catch (e) {}
  }
  box.innerHTML = '<h2>LE MIE NOTE</h2>';
  for (const n of list) {
    const d = cache[n.id], row = document.createElement('div'); row.className = 'n';
    const when = new Date(n.t).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    row.innerHTML = '<div><b></b><small></small></div>';
    row.querySelector('b').textContent = d ? d.name.replace(/\.md$/, '').replace(/^\d{4}-\d\d-\d\d_\d\d-\d\d_/, '') : 'In elaborazione sul computer…';
    row.querySelector('small').textContent = when + (d ? ' · ' + d.user : '');
    if (d) {
      const op = document.createElement('button'); op.textContent = 'Apri'; op.onclick = () => openNote(d);
      const cp = document.createElement('button'); cp.textContent = 'Copia'; cp.onclick = () => copyNote(d);
      row.querySelector('div').onclick = () => openNote(d);
      row.append(op, cp);
    }
    box.appendChild(row);
  }
}
const fixMd = md => (md.includes('\\n') ? md.replace(/\\n/g, '\n').replace(/\\"/g, '"') : md);
async function copyNote(d) { try { await navigator.clipboard.writeText(fixMd(d.md)); say('Prompt copiato', 'ok'); } catch (e) { say('Copia non riuscita: tieni premuto sul testo per copiarlo', 'err'); } }
let viewing = null;
function openNote(d) { viewing = d; $('vtext').textContent = fixMd(d.md); $('view').classList.add('on'); }
$('vclose').onclick = () => $('view').classList.remove('on');
$('vcopy').onclick = () => viewing && copyNote(viewing);
$('vsave').onclick = () => viewing && saveFile(viewing);
async function saveFile(d) {
  const file = new File([fixMd(d.md)], d.name, { type: 'text/plain' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: d.name }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = d.name; document.body.appendChild(a); a.click(); a.remove();
}
setInterval(() => { if (document.visibilityState === 'visible') loadNotes(); }, 20000);
loadNotes();

if (STANDALONE) $('oldicon').hidden = false;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
showQ(); flush();
</script>
</body>
</html>
